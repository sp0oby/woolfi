name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    name: forge build + test + fmt
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test (ci profile — heavy fuzz/invariant runs)
        run: forge test -vvv

      - name: Gas snapshot check (deterministic tests only — fuzz/invariant gas is not reproducible across runs; fork tests skip without RPC)
        run: forge snapshot --check --no-match-test "(testFuzz|invariant)" --no-match-path "test/fork/*"

      - name: Robinhood fork checks
        if: env.ROBINHOOD_RPC_URL != ''
        run: forge test --match-path "test/fork/*" -vvv

  application-checks:
    name: frontend + indexer + keeper + Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            keeper/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Keeper
        working-directory: keeper
        run: npm ci && npm test && npm run typecheck

      - name: Indexer
        working-directory: indexer
        run: npm install --ignore-scripts && npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deployment coordinator tests
        run: python -m unittest discover -s test/script -p "test_*.py"

      - name: Validate disabled production plan
        run: python script/launch_orchestrator.py validate
