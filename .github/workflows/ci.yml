name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    name: forge build + test + fmt
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: gas accounting changes between forge releases, so the snapshot only reproduces on the version that wrote it.
          version: v1.8.1

      - name: Show forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test (ci profile, heavy fuzz/invariant runs)
        run: forge test -vvv

      # Deterministic tests only: fuzz/invariant gas is not reproducible across runs, fork tests skip
      # without RPC, and test_liveManifestIsReadable reads a file whose absolute path (and so gas)
      # differs between machines.
      - name: Gas snapshot check
        run: forge snapshot --check --no-match-test "(testFuzz|invariant|test_dryRunDeploysRouter|test_liveManifestIsReadable)" --no-match-path "test/fork/*"

      - name: Robinhood fork checks
        if: env.ROBINHOOD_RPC_URL != ''
        # Public RPC rate-limits parallel forks (HTTP 429); run fork tests one at a time.
        run: forge test --match-path "test/fork/*" --threads 1 -vvv

  application-checks:
    name: frontend + indexer + keeper + Python
    runs-on: ubuntu-latest
    env:
      ROBINHOOD_BATCH_CONFIG: ${{ secrets.ROBINHOOD_BATCH_CONFIG }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            keeper/package-lock.json
            indexer/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Keeper
        working-directory: keeper
        run: npm ci && npm test && npm run typecheck

      - name: Indexer
        working-directory: indexer
        run: npm ci --ignore-scripts && npm test && npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deployment coordinator tests
        run: python -m unittest discover -s test/script -p "test_*.py"

      - name: Validate disabled production plan
        run: python script/launch_orchestrator.py validate

      # The approved batch config is gitignored; supply it as the ROBINHOOD_BATCH_CONFIG secret (the
      # JSON file's contents) once the core contracts are deployed and their addresses are in it.
      # Until the manifest says launchStatus "live", CI validates the config against chain state;
      # after that it runs the full readiness gate (all 18 pools and every launch gate). Skips
      # while either secret is unset.
      - name: Robinhood batch config (validate pre-launch, readiness once live)
        if: env.ROBINHOOD_BATCH_CONFIG != '' && env.ROBINHOOD_RPC_URL != ''
        run: |
          printf '%s' "$ROBINHOOD_BATCH_CONFIG" > script/config/robinhood-batch.json
          status=$(python -c "import json;print(json.load(open('frontend/lib/deployments/robinhood.json')).get('launchStatus',''))")
          if [ "$status" = "live" ]; then cmd=readiness; else cmd=validate; fi
          python script/robinhood_batch.py "$cmd" --config script/config/robinhood-batch.json
